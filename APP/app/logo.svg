<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1932 1932" width="1932" height="1932">
  <defs>
    <clipPath id="sq"><rect width="1932" height="1932" rx="340"/></clipPath>
    <radialGradient id="glow" cx="990" cy="1060" r="1100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d3429"/><stop offset=".45" stop-color="#232224"/><stop offset="1" stop-color="#151517"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F9A94A"/><stop offset="1" stop-color="#E2782A"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCEBAA"/><stop offset=".45" stop-color="#F4C84E"/><stop offset="1" stop-color="#D9A12E"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAA94C"/><stop offset="1" stop-color="#E0661F"/>
    </linearGradient>
    <g id="frame"><rect width="170" height="140" rx="14" fill="#FDD07C" stroke="#C8701F" stroke-width="10"/></g>
    <g id="hole"><rect width="56" height="40" rx="7" fill="#2B1608"/></g>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1932" height="1932" fill="url(#glow)"/>
    <!-- rayos -->
    <g fill="#ffffff" opacity=".045" transform="translate(990 1060)">
      <path id="ray" d="M0,0 L-80,-1700 L80,-1700 Z"/>
      <use href="#ray" transform="rotate(15)"/><use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(75)"/><use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(105)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(165)"/><use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(195)"/><use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(255)"/><use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(285)"/><use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(315)"/>
      <use href="#ray" transform="rotate(330)"/><use href="#ray" transform="rotate(345)"/>
    </g>

    <!-- película, trozo izquierdo -->
    <g transform="translate(-40 1050) rotate(-15.5)">
      <rect x="-200" y="-200" width="1120" height="390" fill="url(#film)" stroke="#8A4A14" stroke-width="10"/>
      <use href="#hole" x="-120" y="-172"/><use href="#hole" x="-20" y="-172"/><use href="#hole" x="80" y="-172"/><use href="#hole" x="180" y="-172"/>
      <use href="#hole" x="280" y="-172"/><use href="#hole" x="380" y="-172"/><use href="#hole" x="480" y="-172"/><use href="#hole" x="580" y="-172"/>
      <use href="#hole" x="680" y="-172"/><use href="#hole" x="780" y="-172"/>
      <use href="#hole" x="-120" y="122"/><use href="#hole" x="-20" y="122"/><use href="#hole" x="80" y="122"/><use href="#hole" x="180" y="122"/>
      <use href="#hole" x="280" y="122"/><use href="#hole" x="380" y="122"/><use href="#hole" x="480" y="122"/><use href="#hole" x="580" y="122"/>
      <use href="#hole" x="680" y="122"/><use href="#hole" x="780" y="122"/>
      <use href="#frame" x="-150" y="-75"/><use href="#frame" x="60" y="-75"/><use href="#frame" x="270" y="-75"/><use href="#frame" x="480" y="-75"/>
    </g>
    <!-- película, trozo derecho -->
    <g transform="translate(1080 770) rotate(-15.5)">
      <rect x="0" y="-200" width="1100" height="390" fill="url(#film)" stroke="#8A4A14" stroke-width="10"/>
      <use href="#hole" x="40" y="-172"/><use href="#hole" x="140" y="-172"/><use href="#hole" x="240" y="-172"/><use href="#hole" x="340" y="-172"/>
      <use href="#hole" x="440" y="-172"/><use href="#hole" x="540" y="-172"/><use href="#hole" x="640" y="-172"/><use href="#hole" x="740" y="-172"/>
      <use href="#hole" x="840" y="-172"/><use href="#hole" x="940" y="-172"/>
      <use href="#hole" x="40" y="122"/><use href="#hole" x="140" y="122"/><use href="#hole" x="240" y="122"/><use href="#hole" x="340" y="122"/>
      <use href="#hole" x="440" y="122"/><use href="#hole" x="540" y="122"/><use href="#hole" x="640" y="122"/><use href="#hole" x="740" y="122"/>
      <use href="#hole" x="840" y="122"/><use href="#hole" x="940" y="122"/>
      <use href="#frame" x="70" y="-75"/><use href="#frame" x="280" y="-75"/><use href="#frame" x="490" y="-75"/><use href="#frame" x="700" y="-75"/>
    </g>

    <!-- mangos -->
    <g stroke="#2B1608" stroke-width="28" stroke-linejoin="round" fill="url(#handle)">
      <path d="M955,1100 L820,1395 L915,1430 L1010,1150 Z"/>
      <path d="M1015,1140 L1160,1310 L1235,1245 L1060,1095 Z"/>
      <path fill-rule="evenodd" d="M800,1368 a232,232 0 1 0 0.1,0 Z M800,1484 a116,116 0 1 1 -0.1,0 Z"/>
      <path fill-rule="evenodd" d="M1330,1228 a222,222 0 1 0 0.1,0 Z M1330,1334 a116,116 0 1 1 -0.1,0 Z"/>
    </g>
    <path d="M640,1450 a190,190 0 0 1 120,-60" fill="none" stroke="#FCC27A" stroke-width="16" stroke-linecap="round" opacity=".8"/>
    <path d="M1170,1320 a185,185 0 0 1 110,-70" fill="none" stroke="#FCC27A" stroke-width="16" stroke-linecap="round" opacity=".8"/>

    <!-- cuchillas -->
    <g stroke="#2B1608" stroke-width="28" stroke-linejoin="round" fill="url(#blade)">
      <path d="M638,248 C735,262 790,370 818,490 L978,880 L978,1050 L930,1050 Z"/>
      <path d="M988,192 C1050,300 1078,470 1078,640 L1065,1055 L982,1055 Z"/>
    </g>
    <path d="M672,300 C730,330 765,400 785,470" fill="none" stroke="#FFF6D5" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <path d="M1004,240 C1030,320 1045,420 1048,520" fill="none" stroke="#FFF6D5" stroke-width="14" stroke-linecap="round" opacity=".85"/>

    <!-- eje -->
    <circle cx="995" cy="1090" r="62" fill="#2B1608"/>
    <circle cx="995" cy="1090" r="40" fill="#FDD07C"/>

    <!-- destellos -->
    <path d="M423,295 C440,370 470,395 535,410 C470,425 440,450 423,520 C406,450 376,425 311,410 C376,395 406,370 423,295 Z" fill="#F9D46A"/>
    <path d="M1510,990 C1521,1035 1540,1052 1584,1065 C1540,1078 1521,1095 1510,1140 C1499,1095 1480,1078 1436,1065 C1480,1052 1499,1035 1510,990 Z" fill="#F2D27A"/>
    <circle cx="1245" cy="310" r="34" fill="#C9C5C1"/>
    <circle cx="265" cy="1245" r="27" fill="#C9C5C1"/>
    <circle cx="1660" cy="452" r="19" fill="#C9C5C1" opacity=".6"/>
  </g>
</svg>
