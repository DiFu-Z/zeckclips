# Genera los instaladores de ZeckClips para Windows, macOS (Intel y Apple Silicon) y Linux.
# El proyecto está en APP/. Se ejecuta al subir a main un cambio de "version" en APP/package.json (crea la versión v<versión>),
# al publicar una etiqueta v* (p. ej. v1.0.0) o a mano desde la pestaña Actions.
name: Instaladores

on:
  push:
    branches: [main]
    paths: [APP/package.json, .github/workflows/build.yml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: APP

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
          - os: ubuntu-latest
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: APP/package-lock.json
      - run: npm ci
      - run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZeckClips-${{ runner.os }}
          path: |
            APP/dist/*.dmg
            APP/dist/*.zip
            APP/dist/*.exe
            APP/dist/*.AppImage
            APP/dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          name: ZeckClips ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ github.workspace }}/out/*
